services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: craque
      POSTGRES_PASSWORD: craque
      POSTGRES_DB: craque
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craque"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://craque:craque@db:5432/craque
      JWT_SECRET: ${JWT_SECRET:-somente-desenvolvimento-troque-este-segredo}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: '["http://localhost:8080"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
