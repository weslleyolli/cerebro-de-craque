# Antes de subir: cp .env.example .env e preencha os segredos.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: craque
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: craque
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Só nesta máquina, para desenvolver a API fora do Docker. Nunca na rede.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craque"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://craque:${POSTGRES_PASSWORD}@db:5432/craque
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-8080}"]'
    depends_on:
      db:
        condition: service_healthy
    # Sem porta publicada: o nginx do serviço web fala com a API pela rede interna.

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
